name: Daily Fund Data Update

on:
  schedule:
    - cron: '45 3 * * *'  # Runs at 03:45 UTC (09:15 AM IST) every day
  workflow_dispatch:      # Allows manual triggering

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Crucial for allowing the bot to push data
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Ingestion Pipeline
        run: |
          python ingest/scraper.py
          python ingest/chunker.py
          python ingest/embedder.py
          python ingest/vector_store.py
          
      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/chroma/
          git commit -m "chore: daily automated fund data update [skip ci]" || echo "No changes to commit"
          git push
